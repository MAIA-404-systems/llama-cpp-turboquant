name: Build and Release llama-server Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - feature/turboquant-kv-cache
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild (CUDA asset only)
        required: false
        type: string

permissions:
  contents: write

env:
  CMAKE_COMMON_ARGS: "-DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_BORINGSSL=ON"
  VULKAN_VERSION_WIN: "1.4.357.0"
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  ARTIFACT_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || github.sha }}

jobs:
  windows-cuda:
    name: Build Windows CUDA
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install CUDA Toolkit 12.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'

      - name: Install Ninja
        run: choco install ninja

      - name: Build with CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DCMAKE_CUDA_FLAGS="-Xcudafe --diag_suppress=221" ^
            ${{ env.CMAKE_COMMON_ARGS }}
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Package Windows CUDA Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build\bin\Release\llama-server.exe dist\
          Get-ChildItem build\bin\Release -Filter *.dll -File | Copy-Item -Destination dist\
          $dst = '.\dist\'
          $cudaDirs = @("$env:CUDA_PATH\bin", "$env:CUDA_PATH\lib", "$env:CUDA_PATH\bin\x64", "$env:CUDA_PATH\lib\x64")
          foreach ($dir in $cudaDirs) {
            if (Test-Path $dir) {
              robocopy $dir $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll nvJitLink*.dll nvrtc*.dll nvfatbin*.dll
              if ($LASTEXITCODE -gt 7) { throw "CUDA DLL copy failed from $dir (robocopy exit $LASTEXITCODE)" }
              $global:LASTEXITCODE = 0
            }
          }
          Remove-Item -Path dist\*.log -ErrorAction SilentlyContinue
          foreach ($name in @('llama-server.exe', 'cudart64_12.dll', 'cublas64_12.dll', 'cublasLt64_12.dll')) {
            if (-not (Test-Path (Join-Path dist $name))) { throw "Missing CUDA release dependency: $name" }
          }
          if (-not (Get-ChildItem -Path dist -Filter 'nvJitLink*.dll' -File)) {
            throw 'Missing CUDA release dependency: nvJitLink*.dll'
          }
          # Include transitive imports too; cuBLAS and nvJitLink may load other CUDA DLLs.
          $msvcTools = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC'
          $dumpbin = Get-ChildItem $msvcTools -Filter dumpbin.exe -File -Recurse |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'MSVC dumpbin.exe not found; cannot verify CUDA DLL dependencies' }
          $pending = [System.Collections.Generic.Queue[string]]::new()
          Get-ChildItem dist -File | Where-Object { $_.Extension -ieq '.dll' -or $_.Extension -ieq '.exe' } |
            ForEach-Object { $pending.Enqueue($_.FullName) }
          $checked = @{}
          $missing = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $needsNvidiaDriver = $false
          while ($pending.Count -gt 0) {
            $binary = $pending.Dequeue()
            if ($checked.ContainsKey($binary)) { continue }
            $checked[$binary] = $true
            $imports = & $dumpbin.FullName /dependents $binary
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect DLL imports: $binary" }
            foreach ($line in $imports) {
              if ($line -notmatch '^\s*([A-Za-z0-9_.-]+\.dll)\s*$') { continue }
              $name = $Matches[1]
              if ($name -ieq 'nvcuda.dll') {
                $needsNvidiaDriver = $true
                continue  # Supplied by the GPU driver on the destination PC, never redistributed.
              }
              if ($name -match '^(api-ms-|ext-ms-)') { continue }
              $local = Join-Path $dst $name
              if (Test-Path $local) { continue }
              if (Test-Path (Join-Path "$env:SystemRoot\System32" $name)) { continue }
              $source = $cudaDirs | ForEach-Object { Join-Path $_ $name } |
                Where-Object { Test-Path $_ } | Select-Object -First 1
              if ($source) {
                Copy-Item -LiteralPath $source -Destination $local
                Write-Host "Bundled transitive CUDA dependency: $name"
                $pending.Enqueue((Resolve-Path $local).Path)
              } else {
                [void] $missing.Add($name)
              }
            }
          }
          if ($missing.Count) { throw "Unresolved Windows DLL imports: $($missing -join ', ')" }
          if ($needsNvidiaDriver -and -not (Test-Path "$env:SystemRoot\System32\nvcuda.dll")) {
            Write-Host 'Static imports verified. Skipping CUDA --version: this runner has no NVIDIA driver (nvcuda.dll).'
          } else {
            $oldPath = $env:PATH
            try {
              $env:PATH = "$((Resolve-Path dist).Path);$env:SystemRoot\System32;$env:SystemRoot"
              $server = Start-Process -FilePath (Resolve-Path dist\llama-server.exe).Path -ArgumentList '--version' -PassThru -NoNewWindow
              if (-not $server.WaitForExit(20000)) {
                $server.Kill()
                throw 'Packaged CUDA server timed out during --version'
              }
              if ($server.ExitCode -ne 0) { throw "Packaged CUDA server exited with $($server.ExitCode) during --version" }
            } finally {
              $env:PATH = $oldPath
            }
          }
          Compress-Archive -Path dist\* -DestinationPath "llama-server-$env:ARTIFACT_TAG-windows-x64-cuda12.4.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-cuda
          path: llama-server-${{ env.ARTIFACT_TAG }}-windows-x64-cuda12.4.zip

  windows-vulkan:
    name: Build Windows Vulkan
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -o $env:RUNNER_TEMP\VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION_WIN}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION_WIN}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          $vkPath = "C:\VulkanSDK\${env:VULKAN_VERSION_WIN}"
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$vkPath"
          Add-Content $env:GITHUB_PATH "$vkPath\bin"
          Write-Host "Configured VULKAN_SDK=$vkPath"

      - name: Build with CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=OFF -DGGML_VULKAN=ON ${{ env.CMAKE_COMMON_ARGS }}
          cmake --build build --config Release --target llama-server -j 4

      - name: Package Windows Vulkan Binary
        shell: pwsh
        timeout-minutes: 1
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build\bin\Release\llama-server.exe dist\
          Get-ChildItem build\bin\Release -Filter *.dll -File | Copy-Item -Destination dist\
          & .\dist\llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged Vulkan server exited with $LASTEXITCODE" }
          Compress-Archive -Path dist\* -DestinationPath llama-server-${{ env.ARTIFACT_TAG }}-windows-x64-vulkan.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-vulkan
          path: llama-server-${{ env.ARTIFACT_TAG }}-windows-x64-vulkan.zip

  windows-cpu:
    name: Build Windows CPU
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=OFF ${{ env.CMAKE_COMMON_ARGS }}
          cmake --build build --config Release --target llama-server -j 4

      - name: Package Windows CPU Binary
        shell: pwsh
        timeout-minutes: 1
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build\bin\Release\llama-server.exe dist\
          Get-ChildItem build\bin\Release -Filter *.dll -File | Copy-Item -Destination dist\
          & .\dist\llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged CPU server exited with $LASTEXITCODE" }
          Compress-Archive -Path dist\* -DestinationPath llama-server-${{ env.ARTIFACT_TAG }}-windows-x64-cpu.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-cpu
          path: llama-server-${{ env.ARTIFACT_TAG }}-windows-x64-cpu.zip

  linux-cuda:
    name: Build Linux CUDA
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.1'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      - name: Build with CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            ${{ env.CMAKE_COMMON_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Package Linux CUDA Binary
        run: |
          mkdir -p dist
          cp build/bin/llama-server dist/
          find build/bin -maxdepth 1 -name '*.so*' -exec cp -a {} dist/ \;
          cuda_root=$(realpath "$CUDA_PATH")
          for name in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
            source=$(find "$cuda_root" -path '*/stubs' -prune -o -name "$name" -print -quit)
            test -n "$source"
            cp -L "$source" "dist/$name"
          done
          # GitHub's CUDA runner has no driver; use the toolkit stub for this version check.
          driver_stub=$(find "$cuda_root" -path '*/stubs/libcuda.so' -print -quit)
          test -n "$driver_stub"
          mkdir -p "$RUNNER_TEMP/cuda-driver-stub"
          ln -sf "$driver_stub" "$RUNNER_TEMP/cuda-driver-stub/libcuda.so.1"
          env LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-driver-stub" ./dist/llama-server --version
          tar -czvf llama-server-${{ env.ARTIFACT_TAG }}-linux-x64-cuda12.4.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-cuda
          path: llama-server-${{ env.ARTIFACT_TAG }}-linux-x64-cuda12.4.tar.gz

  linux-vulkan:
    name: Build Linux Vulkan
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev cmake

      - name: Build with CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            ${{ env.CMAKE_COMMON_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Package Linux Vulkan Binary
        run: |
          mkdir -p dist
          cp build/bin/llama-server dist/
          find build/bin -maxdepth 1 -name '*.so*' -exec cp -a {} dist/ \;
          env -u LD_LIBRARY_PATH ./dist/llama-server --version
          env -u LD_LIBRARY_PATH ./dist/llama-server --list-devices
          tar -czvf llama-server-${{ env.ARTIFACT_TAG }}-linux-x64-vulkan.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-vulkan
          path: llama-server-${{ env.ARTIFACT_TAG }}-linux-x64-vulkan.tar.gz

  linux-cpu:
    name: Build Linux CPU
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      - name: Build with CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            ${{ env.CMAKE_COMMON_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Package Linux CPU Binary
        run: |
          mkdir -p dist
          cp build/bin/llama-server dist/
          find build/bin -maxdepth 1 -name '*.so*' -exec cp -a {} dist/ \;
          env -u LD_LIBRARY_PATH ./dist/llama-server --version
          env -u LD_LIBRARY_PATH ./dist/llama-server --list-devices
          tar -czvf llama-server-${{ env.ARTIFACT_TAG }}-linux-x64-cpu.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-cpu
          path: llama-server-${{ env.ARTIFACT_TAG }}-linux-x64-cpu.tar.gz

  macos-metal:
    name: Build macOS Metal
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            ${{ env.CMAKE_COMMON_ARGS }}
          cmake --build build --config Release -j $(sysctl -n hw.logicalcpu)

      - name: Package macOS Metal Binary
        run: |
          mkdir -p dist
          cp build/bin/llama-server dist/
          find build/bin -maxdepth 1 -name '*.dylib' -exec cp -L {} dist/ \;
          ./dist/llama-server --version
          tar -czvf llama-server-${{ env.ARTIFACT_TAG }}-macos-arm64-metal.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-metal
          path: llama-server-${{ env.ARTIFACT_TAG }}-macos-arm64-metal.tar.gz

  macos-vulkan:
    name: Build macOS Vulkan
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan dependencies
        run: |
          brew install vulkan-headers vulkan-loader molten-vk glslang shaderc

      - name: Build with CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_VULKAN=ON \
            ${{ env.CMAKE_COMMON_ARGS }}
          cmake --build build --config Release -j $(sysctl -n hw.logicalcpu)

      - name: Package macOS Vulkan Binary
        run: |
          mkdir -p dist
          cp build/bin/llama-server dist/
          find build/bin -maxdepth 1 -name '*.dylib' -exec cp -L {} dist/ \;
          ./dist/llama-server --version
          tar -czvf llama-server-${{ env.ARTIFACT_TAG }}-macos-arm64-vulkan.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-vulkan
          path: llama-server-${{ env.ARTIFACT_TAG }}-macos-arm64-vulkan.tar.gz

  release:
    name: Release Binaries
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - windows-cuda
      - windows-vulkan
      - windows-cpu
      - linux-cuda
      - linux-vulkan
      - linux-cpu
      - macos-metal
      - macos-vulkan
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist-release
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist-release/*.zip
            ./dist-release/*.tar.gz
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repair-windows-cuda:
    name: Replace Windows CUDA Release Asset
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: windows-cuda
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows CUDA artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-cuda
          path: ./dist-release

      - name: Verify existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')" = "$RELEASE_TAG"

      - name: Replace CUDA asset in existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ./dist-release/*-windows-x64-cuda12.4.zip
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repair-linux-cuda:
    name: Replace Linux CUDA Release Asset
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: linux-cuda
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux CUDA artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-cuda
          path: ./dist-release

      - name: Verify existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')" = "$RELEASE_TAG"

      - name: Replace CUDA asset in existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ./dist-release/*-linux-x64-cuda12.4.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
